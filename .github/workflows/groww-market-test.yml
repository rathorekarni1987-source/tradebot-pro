name: Groww Market Data Test

on:
  workflow_dispatch:

jobs:
  test-groww-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Test Groww Multi-Symbol LTP
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}

        run: |
          echo "Testing Groww multi-symbol market data..."

          HTTP_CODE=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -G \
            "https://api.groww.in/v1/live-data/ltp" \
            --data-urlencode "segment=CASH" \
            --data-urlencode "exchange_symbols=NSE_NIFTY,BSE_SENSEX,NSE_RELIANCE,NSE_TCS,NSE_HDFCBANK" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${GROWW_ACCESS_TOKEN}" \
            -H "X-API-VERSION: 1.0")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Groww API request failed."
            cat response.json
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("response.json", "r") as f:
              data = json.load(f)

          print("Groww raw response:")
          print(json.dumps(data, indent=2))

          if data.get("status") != "SUCCESS":
              print("Groww returned FAILURE.")
              raise SystemExit(1)

          payload = data.get("payload", {})

          symbols = [
              "NSE_NIFTY",
              "BSE_SENSEX",
              "NSE_RELIANCE",
              "NSE_TCS",
              "NSE_HDFCBANK",
          ]

          print("\n========== REAL MARKET DATA ==========")

          for symbol in symbols:
              price = payload.get(symbol)

              if price is None:
                  print(f"{symbol}: NOT RETURNED")
              else:
                  print(f"{symbol}: {price}")

          print("======================================")
          print("Groww multi-symbol connection: SUCCESS")
          PY
