name: Build TradeBot Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TradeBotPro_Android_Project.zip'
      - '.github/workflows/tradebot-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: unzip -q TradeBotPro_Android_Project.zip -d project

      - name: Download Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        working-directory: project/TradeBotProAndroid
        run: /tmp/gradle-8.11.1/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeBotPro-debug-APK
          path: project/TradeBotProAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
