name: Build TradeBot Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TradeBotPro_Android_Project.zip'
      - '.github/workflows/tradebot-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "Android SDK location: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT"

      - name: Extract Android project
        run: |
          echo "Repository files:"
          ls -la
          ZIP_FILE=$(find . -type f -name 'TradeBotPro_Android_Project.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          ls -la project
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        working-directory: project/TradeBotProAndroid
        run: /tmp/gradle-8.11.1/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeBotPro-debug-APK
          path: project/TradeBotProAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
