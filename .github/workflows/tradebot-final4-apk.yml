name: Build TradeBot Pro Final 4.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p final4app/app/src/main/java/com/tradebot/pro

          cat > final4app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TradeBotProFinal4'
          include ':app'
          EOF

          cat > final4app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > final4app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > final4app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tradebot.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.tradebot.pro'
                  minSdk 24
                  targetSdk 35
                  versionCode 40
                  versionName '4.0'
              }
          }
          EOF

          mkdir -p final4app/app/src/main

          cat > final4app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="TradeBot Pro"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > final4app/app/src/main/java/com/tradebot/pro/MainActivity.java <<'EOF'
          package com.tradebot.pro;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 100;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, String url) {
                          return !url.startsWith(
                              "https://tradebot-pro.rathorekarni1987.workers.dev/"
                          );
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          Intent intent = new Intent(
                              Intent.ACTION_OPEN_DOCUMENT
                          );
                          intent.addCategory(
                              Intent.CATEGORY_OPENABLE
                          );
                          intent.setType("application/json");

                          startActivityForResult(
                              intent, FILE_REQUEST
                          );
                          return true;
                      }
                  });

                  web.loadUrl(
                      "https://tradebot-pro.rathorekarni1987.workers.dev/"
                  );
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

                  super.onActivityResult(
                      requestCode, resultCode, data
                  );

                  if (requestCode == FILE_REQUEST &&
                      fileCallback != null) {

                      Uri[] result = null;

                      if (resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {

                          result = new Uri[]{
                              data.getData()
                          };
                      }

                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Final 4.0 APK
        working-directory: final4app
        run: gradle --no-daemon assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeBotPro-Final4-APK
          path: final4app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
